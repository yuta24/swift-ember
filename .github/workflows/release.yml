name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test release
    runs-on: macos-26
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate the release tag
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must have the form major.minor.patch" >&2
            exit 1
          fi
          release_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG" 2>/dev/null)" || {
            echo "release tag $RELEASE_TAG does not exist" >&2
            exit 1
          }
          git merge-base --is-ancestor \
            "$release_commit" "origin/$DEFAULT_BRANCH" || {
              echo "the release commit must be on the default branch" >&2
              exit 1
            }
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Select the Xcode toolchain
        run: |
          scripts/select-xcode.sh --list
          developer_dir="$(scripts/select-xcode.sh)"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Test the host tool
        run: scripts/ci.sh --only tests

  release:
    name: Sign, notarize, and package release
    needs: test
    runs-on: macos-26
    environment: release
    concurrency:
      group: swift-ember-release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.commit }}

      - name: Select the Xcode toolchain
        run: |
          scripts/select-xcode.sh --list
          developer_dir="$(scripts/select-xcode.sh)"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Import the signing certificate and notary key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD \
              NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing release secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          umask 077
          signing="$RUNNER_TEMP/swift-ember-signing"
          mkdir "$signing"
          keychain="$signing/release.keychain-db"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$signing/developer-id.p12"
          if ! security import "$signing/developer-id.p12" -k "$keychain" -f pkcs12 \
              -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign >/dev/null 2>&1; then
            echo "::error::Could not import the Developer ID certificate; check the .p12 and its password"
            exit 1
          fi
          rm -f "$signing/developer-id.p12"
          if ! security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$password" "$keychain" >/dev/null 2>&1; then
            echo "::error::Could not grant codesign access to the temporary keychain"
            exit 1
          fi
          # Include the temporary keychain when codesign builds the certificate chain.
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"

          if ! identity="$(security find-identity -v -p codesigning "$keychain" 2>/dev/null |
            awk '/"Developer ID Application: / { print $2 }')" ||
            [[ ! "$identity" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::Expected exactly one valid Developer ID Application identity in the .p12"
            exit 1
          fi
          printf '%s\n' "$identity" > "$signing/identity"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$signing/notary-key.p8"

      - name: Sign, notarize, and verify the release assets
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          signing="$RUNNER_TEMP/swift-ember-signing"
          EMBER_CODESIGN_IDENTITY="$(cat "$signing/identity")"
          export EMBER_CODESIGN_IDENTITY
          export EMBER_CODESIGN_KEYCHAIN="$signing/release.keychain-db"
          export NOTARY_KEY_PATH="$signing/notary-key.p8"
          scripts/package-release.sh --notarize "$RELEASE_TAG"

      - name: Remove the temporary keychain and keys
        if: always()
        run: |
          signing="$RUNNER_TEMP/swift-ember-signing"
          rm -f "$signing/developer-id.p12" "$signing/notary-key.p8" "$signing/identity"
          keychain="$signing/release.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

      - name: Verify skill installation from the release
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          unzip -q dist/swift-ember.zip -d "$work"
          cd "$work"
          ./swift-ember/install.sh "$work/prefix"
          "$work/prefix/bin/swift-ember" skill install --dir "$work/agent-skills"
          test -f "$work/agent-skills/swift-ember/SKILL.md"
          test -f "$work/agent-skills/swift-ember/reference.md"

      # A rerun may find the draft created by an earlier attempt. Replacing
      # assets on a draft is safe; replacing an already published release is
      # not, so that case deliberately fails.
      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Release tag $RELEASE_TAG no longer points to the tested commit"
            exit 1
          fi

          assets=(
            dist/swift-ember.zip
            dist/swift-ember.zip.sha256
            dist/swift-ember.artifactbundle.zip
            dist/swift-ember.artifactbundle.zip.sha256
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" \
              --json isDraft --jq .isDraft)"
            if [ "$is_draft" != true ]; then
              echo "release $RELEASE_TAG is already published" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --generate-notes \
              --title "swift-ember $RELEASE_TAG" \
              --verify-tag
          fi
